<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6"/>
      <stop offset="100%" style="stop-color:#5EEAD4"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>

  <!-- Sparkles icon (from Lucide) -->
  <g transform="translate(128, 128)" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main sparkle -->
    <path d="M0,-40 L0,40" />
    <path d="M-40,0 L40,0" />
    <!-- Diagonal sparkles -->
    <path d="M-28,-28 L28,28" stroke-width="6" opacity="0.7" />
    <path d="M28,-28 L-28,28" stroke-width="6" opacity="0.7" />
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="white" stroke="none" />
  </g>
</svg>
