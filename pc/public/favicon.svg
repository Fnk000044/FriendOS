<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="planetGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="45%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#60A5FA"/>
      <stop offset="70%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 背景圆（暖色调白色基底） -->
  <circle cx="128" cy="128" r="124" fill="#F8FAFC"/>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 外层轨道环（倾斜椭圆） -->
  <g transform="rotate(-25 128 128)">
    <ellipse cx="128" cy="128" rx="108" ry="38" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.55"/>
    <ellipse cx="128" cy="128" rx="88" ry="30" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.4"/>
    <ellipse cx="128" cy="128" rx="68" ry="23" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- 中央行星（带光照的球体） -->
  <circle cx="128" cy="128" r="58" fill="url(#planetGrad)"/>
  <!-- 行星表面经线 -->
  <path d="M128 70 Q105 128 128 186" fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.35"/>
  <path d="M128 70 Q151 128 128 186" fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.35"/>
  <ellipse cx="128" cy="128" rx="58" ry="58" fill="none" stroke="#1E40AF" stroke-width="1" opacity="0.25"/>

  <!-- 轨道上的卫星节点（3 颗，不同轨道） -->
  <g transform="rotate(-25 128 128)">
    <!-- 外轨道卫星 -->
    <circle cx="236" cy="128" r="7" fill="#FFFFFF"/>
    <circle cx="236" cy="128" r="11" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <!-- 中轨道卫星 -->
    <g transform="rotate(120 128 128)">
      <circle cx="216" cy="128" r="6" fill="#93C5FD"/>
      <circle cx="216" cy="128" r="9" fill="none" stroke="#60A5FA" stroke-width="1.2" opacity="0.5"/>
    </g>
    <!-- 内轨道卫星 -->
    <g transform="rotate(240 128 128)">
      <circle cx="196" cy="128" r="5" fill="#DBEAFE"/>
    </g>
  </g>

  <!-- 行星核心光点（科技感脉冲） -->
  <circle cx="128" cy="128" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="128" cy="128" r="6" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

  <!-- 四角科技装饰线 -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M16 36 L16 16 L36 16"/>
    <path d="M220 16 L240 16 L240 36"/>
    <path d="M240 220 L240 240 L220 240"/>
    <path d="M36 240 L16 240 L16 220"/>
  </g>
</svg>
